services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sensorhub_mcp
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8000}:8000"
    volumes:
      - ./:/app
    environment:
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-sensorhub_emqx}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-mcp}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?Falta MQTT_PASSWORD en .env (MQTT_MCP_PASSWORD de Stack/.env)}
      - INFLUXDB_URL=${INFLUXDB_URL:-http://sensorhub_influxdb:8086}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-sensorhub_admin_secret_token_123}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-sensorhub}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-sensorhub}
      - MCP_HTTP_PATH=${MCP_HTTP_PATH:-/mcp}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      # Modo stateless (escala horizontal; ver .env.example) y protección
      # contra DNS rebinding: hosts y orígenes aceptados (ver .env.example).
      - MCP_STATELESS_HTTP=${MCP_STATELESS_HTTP:-false}
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,sensorhub_mcp:*}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      # Autenticación OAuth 2.1 con Keycloak (ver .env.example). Las claves
      # públicas se bajan por la red interna, sin pasar por el dominio público.
      - MCP_AUTH_ENABLED=${MCP_AUTH_ENABLED:-true}
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-}
      - MCP_AUTH_ISSUER=${AUTH_PUBLIC_URL:-}/realms/${KC_REALM:-sensorhub}
      - MCP_AUTH_JWKS_URL=http://sensorhub_keycloak:8080/realms/${KC_REALM:-sensorhub}/protocol/openid-connect/certs
    networks:
      - sensorhub_network

  # MCP Inspector: UI para invocar las tools a mano sin un LLM de por medio
  # (ver MCP/README.md, sección "Cómo probarlo"). Dentro de esta red, el
  # servidor MCP de arriba se alcanza como http://sensorhub_mcp:8000/mcp.
  mcp-inspector:
    image: ghcr.io/modelcontextprotocol/inspector:2.9.0
    container_name: sensorhub_mcp_inspector
    restart: unless-stopped
    ports:
      # DANGEROUSLY_OMIT_AUTH de
      # abajo saca el token de autenticación de la UI, así que no conviene
      # que quede alcanzable desde otra cosa que no sea esta máquina.
      - "127.0.0.1:6274:6274"
    environment:
      - HOST=0.0.0.0
      - MCP_AUTO_OPEN_ENABLED=false
      - DANGEROUSLY_OMIT_AUTH=true
      - MCP_INSPECTOR_SECRET_STORE=file
    volumes:
      - mcp_inspector_data:/home/node/.mcp-inspector
    networks:
      - sensorhub_network
    extra_hosts:
      - "${MCP_PUBLIC_HOST:-mcp.localhost}:${MCP_PUBLIC_HOST_IP:-127.0.0.1}"
      - "${AUTH_PUBLIC_HOST:-auth.localhost}:${MCP_PUBLIC_HOST_IP:-127.0.0.1}"

  # ----------------------------------------------------------------------------
  # Keycloak: servidor de autorización OAuth del MCP (registro de clientes,
  # login y emisión de tokens). Se publica en AUTH_PUBLIC_URL a través de
  # Traefik (Stack/tunel-local); la consola de administración, solo en esta
  # máquina: http://localhost:${KC_ADMIN_PORT}. El realm se configura a mano,
  # una sola vez: ver keycloak/configurar-keycloak.md.
  # ----------------------------------------------------------------------------
  keycloak-db:
    image: ${KEYCLOAK_DB_IMAGE:-postgres:17.6-alpine}
    container_name: sensorhub_keycloak_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${KC_DB_PASSWORD:-}
    volumes:
      # Clientes registrados, sesiones y claves de firma: sin esto, cada
      # recreación obligaría a volver a agregar los conectores
      - keycloak_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak", "-d", "keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sensorhub_network

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.1}
    container_name: sensorhub_keycloak
    restart: unless-stopped
    command: start
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KC_ADMIN_PORT:-8081}:8080"
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://sensorhub_keycloak_db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KC_DB_PASSWORD:-}
      # Sin hostname fijo: Keycloak arma las URLs según cómo le llega el pedido.
      # Por Traefik, https://<AUTH_PUBLIC_URL> (de X-Forwarded-*); por
      # http://localhost:KC_ADMIN_PORT, la consola con localhost. El realm del
      # MCP fija su URL pública con su Frontend URL (= AUTH_PUBLIC_URL; ver
      # keycloak/configurar-keycloak.md), así el emisor de sus tokens no
      # depende del pedido. Con un hostname global, el realm master (el de la
      # consola) también usaría el dominio, que Traefik no publica, y la
      # consola no cargaría. El Host no se puede falsear: Traefik solo deja
      # pasar el del dominio y el puerto de la consola es solo local.
      - KC_HOSTNAME_STRICT=false
      # TLS lo termina Traefik: acá HTTP, con la URL original en X-Forwarded-*
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      - KC_HEALTH_ENABLED=true
      # Administrador inicial: se crea solo con la base vacía (primer arranque)
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_ADMIN_USERNAME:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD:-}
    healthcheck:
      # La imagen no trae curl: se consulta /health/ready (puerto de gestión) con bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - sensorhub_network


volumes:
  mcp_inspector_data:
  keycloak_db:
    name: sensorhub_keycloak_db

networks:
  sensorhub_network:
    name: sensorhub_network
    external: true

