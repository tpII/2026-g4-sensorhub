## ==============================================================================
## SensorHub - nginx en el servidor público: enrutamiento L4 por SNI (sin terminar TLS)
## La tabla dominio → máquina (rutas.map) la genera 40-rutas.sh al arrancar, a
## partir de rutas.conf y peers.conf.
## ==============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

stream {
    log_format sni '$remote_addr [$time_local] sni=$ssl_preread_server_name '
                   'upstream=$upstream_addr status=$status '
                   'in=$bytes_received out=$bytes_sent dur=$session_time';
    access_log /dev/stdout sni;
    error_log  /dev/stderr warn;

    # Solo los dominios de rutas.conf viajan por el túnel, cada uno al Traefik
    # de su máquina; el resto va a un puerto cerrado y nginx corta la conexión
    map $ssl_preread_server_name $backend {
        include /etc/nginx/rutas.map;
        default 127.0.0.1:1;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $backend;

        # Le pasa a Traefik la IP real del cliente (PROXY protocol v1)
        proxy_protocol on;

        proxy_connect_timeout 5s;
        # Las conexiones MQTT son de larga duración; el keepalive del cliente
        # las mantiene activas mientras no superen este tiempo sin tráfico
        proxy_timeout 1h;
    }
}
