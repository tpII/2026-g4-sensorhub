name: sensorhub_tunel
services:
  # Cliente WireGuard: dueño del namespace de red que comparte con Traefik.
  # Sin network_mode: host ni socket de Docker; solo ve sensorhub_network y su
  # firewall (ver wireguard/entrypoint.sh) le cierra el acceso al host.
  wireguard:
    build: ./wireguard
    container_name: sensorhub_wg_local
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - WG_PRIVATE_KEY=${WG_PRIVATE_KEY}
      - WG_PEER_PUBLIC_KEY=${WG_PEER_PUBLIC_KEY}
      - WG_ENDPOINT=${WG_ENDPOINT}
      - WG_ADDRESS=${WG_ADDRESS:-10.13.13.2}
      - WG_PEER_ADDRESS=${WG_PEER_ADDRESS:-10.13.13.1}
    healthcheck:
      # Sano si hubo handshake con el servidor público en los últimos 3 minutos
      test: ["CMD-SHELL", "t=$$(wg show wg0 latest-handshakes | awk '{print $$2}'); [ -n \"$$t\" ] && [ $$(( $$(date +%s) - t )) -lt 180 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - sensorhub_network

  # Terminación TLS: MCP (HTTPS → HTTP) y MQTTS (TLS → TCP 1883), por SNI.
  # Escucha en 10.13.13.2:443 dentro del túnel; no publica puertos en el host.
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.3.5}
    container_name: sensorhub_traefik
    restart: unless-stopped
    network_mode: "service:wireguard"
    depends_on:
      - wireguard
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    command:
      - --log.level=INFO
      - --accesslog=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.websecure.address=:443
      # Solo nginx (del otro lado del túnel) puede declarar la IP real del cliente
      - --entrypoints.websecure.proxyprotocol.trustedips=${WG_PEER_ADDRESS:-10.13.13.1}/32
      # Sin límite de lectura: las conexiones MQTT quedan abiertas indefinidamente
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=0
      # Certificados por TLS-ALPN-01: Let's Encrypt valida por el mismo 443
      # (nginx lo rutea por SNI como cualquier conexión), sin abrir el 80
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Falta ACME_EMAIL en .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
    environment:
      - MCP_DOMAIN=${MCP_DOMAIN:?Falta MCP_DOMAIN en .env}
      - MQTT_DOMAIN=${MQTT_DOMAIN:?Falta MQTT_DOMAIN en .env}
      - MCP_HTTP_PATH=${MCP_HTTP_PATH:-/mcp}
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_acme:/data

networks:
  sensorhub_network:
    name: sensorhub_network
    external: true

volumes:
  traefik_acme:
    name: sensorhub_traefik_acme
