## ==============================================================================
## SensorHub - Rutas de Traefik (proveedor file)
## Los dominios se leen de las variables de entorno del contenedor (MCP_DOMAIN,
## MQTT_DOMAIN) mediante el templating del proveedor file.
## ==============================================================================

http:
  routers:
    # MCP: HTTPS terminado acá, HTTP plano hacia el contenedor. Además del
    # endpoint MCP pasan las rutas de OAuth que sirve el mismo servidor:
    # metadatos (/.well-known/oauth-*), /authorize, /token, /register y el login.
    # La regla va en una sola línea: Traefik no acepta saltos de línea adentro.
    mcp:
      rule: 'Host(`{{ env "MCP_DOMAIN" }}`) && (PathPrefix(`{{ env "MCP_HTTP_PATH" }}`) || PathPrefix(`/.well-known/oauth-`) || Path(`/authorize`) || Path(`/token`) || Path(`/register`) || Path(`/oauth/login`))'
      entryPoints:
        - websecure
      service: mcp
      tls:
        certResolver: letsencrypt

  services:
    mcp:
      loadBalancer:
        servers:
          - url: "http://sensorhub_mcp:8000"

tcp:
  routers:
    # MQTTS: TLS terminado acá (por SNI), MQTT plano (TCP 1883) hacia EMQX
    mqtt:
      rule: 'HostSNI(`{{ env "MQTT_DOMAIN" }}`)'
      entryPoints:
        - websecure
      service: emqx
      tls:
        certResolver: letsencrypt

  services:
    emqx:
      loadBalancer:
        servers:
          - address: "sensorhub_emqx:1883"
