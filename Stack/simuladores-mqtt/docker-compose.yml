services:
  simulador-dht:
    build: .
    container_name: sensorhub_simulador_dht
    restart: unless-stopped
    command: ["python", "-u", "simulador_dht.py"]
    environment:
      - BROKER_HOST=sensorhub_emqx
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_ESP_USERNAME:-esp}
      - MQTT_PASSWORD=${MQTT_ESP_PASSWORD:?Falta MQTT_ESP_PASSWORD en .env}
      - DEVICE_ID=aaaaaaaaaaaa
      - INTERVALO_SEGUNDOS=10
    networks:
      - sensorhub_network

  simulador-pir:
    build: .
    container_name: sensorhub_simulador_pir
    restart: unless-stopped
    command: ["python", "-u", "simulador_pir.py"]
    environment:
      - BROKER_HOST=sensorhub_emqx
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_ESP_USERNAME:-esp}
      - MQTT_PASSWORD=${MQTT_ESP_PASSWORD:?Falta MQTT_ESP_PASSWORD en .env}
      - DEVICE_ID=bbbbbbbbbbbb
      - INTERVALO_MIN_SEGUNDOS=2
      - INTERVALO_MAX_SEGUNDOS=8
    networks:
      - sensorhub_network

  simulador-switch:
    build: .
    container_name: sensorhub_simulador_switch
    restart: unless-stopped
    command: ["python", "-u", "simulador_switch.py"]
    environment:
      - BROKER_HOST=sensorhub_emqx
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_ESP_USERNAME:-esp}
      - MQTT_PASSWORD=${MQTT_ESP_PASSWORD:?Falta MQTT_ESP_PASSWORD en .env}
      - DEVICE_ID=cccccccccccc
    networks:
      - sensorhub_network

  simulador-switch-commander:
    build: .
    container_name: sensorhub_simulador_switch_commander
    restart: unless-stopped
    command: ["python", "-u", "simulador_switch_commander.py"]
    environment:
      - BROKER_HOST=sensorhub_emqx
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_MCP_USERNAME:-mcp}
      - MQTT_PASSWORD=${MQTT_MCP_PASSWORD:?Falta MQTT_MCP_PASSWORD en .env}
      - DEVICE_ID=cccccccccccc
      - INTERVALO_SEGUNDOS=4
    networks:
      - sensorhub_network

networks:
  sensorhub_network:
    external: true
