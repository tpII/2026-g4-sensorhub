<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SensorHub Chat</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 820px; margin: 0 auto; padding: 16px; background: #111; color: #eee; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #1b1b1b; color: #eee; }
  button { padding: 10px 16px; border: 0; border-radius: 6px; background: #3b82f6; color: #fff; }
  button:disabled { opacity: .5; }
  .step { border-left: 3px solid #555; margin: 8px 0; padding: 4px 12px; }
  .step b { display: block; margin-bottom: 4px; }
  .mcp_tools { border-color: #a855f7; } .llm_request { border-color: #3b82f6; } .llm_response { border-color: #22c55e; }
  .tool_call { border-color: #f59e0b; } .elicitation { border-color: #ec4899; } .error { border-color: #ef4444; } .reply { border-color: #eee; font-size: 16px; white-space: pre-wrap; }
  pre { background: #1b1b1b; padding: 8px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow-y: auto; }
  small { color: #888; }
</style>
</head>
<body>
<form id="f"><input id="q" autocomplete="off" placeholder="Preguntale algo a SensorHub..." autofocus><button id="b">Enviar</button></form>
<small>Cada consulta es independiente: el cliente no guarda historial. Abajo se ve el flujo completo.</small>
<div id="out"></div>
<script>
const out = document.getElementById("out"), f = document.getElementById("f"), q = document.getElementById("q"), b = document.getElementById("b");
const TITLES = {
  mcp_tools: "1. Cliente → MCP: tools/list (lo que el servidor ofrece)",
  llm_request: "→ Cliente → LLM: mensajes enviados (+ las tools de arriba)",
  llm_response: "← LLM → Cliente: respuesta",
  elicitation: "Servidor MCP → Usuario: elicitation (el usuario eligió)",
  tool_call: "Cliente → MCP: tools/call (ejecutado por el cliente, pedido por el LLM)",
  error: "Error",
};
function step(cls, title, data) {
  const d = document.createElement("div"); d.className = "step " + cls;
  const t = document.createElement("b"); t.textContent = title; d.appendChild(t);
  if (data !== undefined) {
    const det = document.createElement("details"); det.innerHTML = "<summary>ver JSON</summary><pre></pre>";
    det.querySelector("pre").textContent = JSON.stringify(data, null, 2); d.appendChild(det);
  }
  out.appendChild(d); return d;
}
f.onsubmit = async (e) => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return;
  out.innerHTML = ""; b.disabled = true;
  const wait = step("", "Pensando... 0 s"); const t0 = Date.now();
  let asking = false;
  const chatId = crypto.randomUUID();   // identifica esta consulta: su pregunta pendiente no se mezcla con la de otro chat
  const timer = setInterval(async () => {
    wait.firstChild.textContent = "Pensando... " + Math.round((Date.now() - t0) / 1000) + " s";
    if (asking) return;
    const p = await (await fetch("/pending/" + chatId)).json();   // ¿una tool le hace una pregunta al usuario?
    if (!p.options) return;
    asking = true;
    const box = step("elicitation", "El servidor MCP pregunta: " + p.message);
    for (const o of [...p.options, null]) {
      const btn = document.createElement("button"); btn.textContent = o ?? "Cancelar"; btn.style.margin = "4px 6px 4px 0";
      btn.onclick = async () => { box.remove(); await fetch("/answer/" + chatId, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ choice: o }) }); asking = false; };
      box.appendChild(btn);
    }
  }, 1000);
  try {
    const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text, chat_id: chatId }) });
    const data = await r.json();
    clearInterval(timer); out.innerHTML = "";
    step("", "Pregunta: " + text);
    for (const s of data.trace) {
      const { type, ...rest } = s;
      step(type, TITLES[type] || type, rest);
    }
    step("reply", data.reply);
  } catch (err) { clearInterval(timer); wait.firstChild.textContent = "Error: " + err; }
  b.disabled = false; q.focus();
};
</script>
</body>
</html>
