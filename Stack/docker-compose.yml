name: sensorhub_relay
services:
  emqx:
    image: ${EMQX_IMAGE:-emqx/emqx:5.8.0}
    container_name: sensorhub_emqx
    restart: unless-stopped
    ports:
      - "${EMQX_MQTT_PORT:-1883}:1883"          # MQTT TCP
      - "${EMQX_MQTTS_PORT:-8883}:8883"        # MQTT SSL/TLS
      - "${EMQX_WS_PORT:-8083}:8083"            # MQTT WebSocket
      - "${EMQX_WSS_PORT:-8084}:8084"           # MQTT WebSocket Seguro
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"   # Dashboard Web de Administración
    volumes:
      # Plantillas declarativas y script de inyección de variables de entorno en arranque en frío
      - ./broker/templates:/opt/emqx/templates:ro
      - ./broker/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["/opt/emqx/bin/emqx", "foreground"]
    environment:
      - EMQX_DASHBOARD__DEFAULT_USERNAME=${EMQX_DASHBOARD__DEFAULT_USERNAME:-admin}
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_DASHBOARD__DEFAULT_PASSWORD:-admin}
      - INFLUXDB_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN:-sensorhub_admin_secret_token_123}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-sensorhub}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-sensorhub}
    networks:
      - sensorhub_net

  influxdb:
    image: ${INFLUXDB_IMAGE:-influxdb:2.7-alpine}
    container_name: sensorhub_influxdb
    restart: unless-stopped
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"           # API HTTP y Web UI de InfluxDB
    environment:
      # Bootstrap declarativo automático: crea org, bucket y token sin wizard interactivo
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:-adminpassword123}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-sensorhub}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-sensorhub}
      - DOCKER_INFLUXDB_INIT_RETENTION=${INFLUXDB_RETENTION:-0}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN:-sensorhub_admin_secret_token_123}
    volumes:
      # Volumen exclusivo para datos de series temporales (TSDB)
      - influxdb_data:/var/lib/influxdb2
    networks:
      - sensorhub_net

networks:
  sensorhub_net:
    name: sensorhub_network

volumes:
  influxdb_data:
    name: sensorhub_influxdb_data
